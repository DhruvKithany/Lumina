# Lumina-Presenter runtime configuration.
# Override via environment or CLI where supported.

camera:
  index: 0
  width: 640
  height: 480
  fps: 15

# Sensory layer: MediaPipe Holistic (legacy) or Pose+Face (tasks API).
sensory:
  model_complexity: 0
  refine_face_landmarks: true
  # For MediaPipe 0.10+: pose_model_path, face_model_path (or run scripts/download_models.py)

# Kinesic entropy ("fidget") detection
kinesic:
  calibration_seconds: 5
  # Entropy flag when velocity exceeds baseline + (threshold_sigma * std)
  threshold_sigma: 2.0
  window_seconds: 1.5
  # MediaPipe Pose landmark indices: wrists 15,16; elbows 13,14; shoulders 11,12
  landmark_indices: [11, 12, 13, 14, 15, 16]

# Gaze / head pose and "golden zone"
gaze:
  # Allowed head pose (degrees): pitch and yaw relative to camera
  golden_zone_pitch_min: -15
  golden_zone_pitch_max: 15
  golden_zone_yaw_min: -20
  golden_zone_yaw_max: 20
  gaze_lost_seconds: 1.5

# Cognitive stall -> knowledge probe injection
probes:
  enabled: true
  silence_seconds: 4.0
  file: "assets/probes.json"

# Backend signal-processing unit (variance/iris-based)
bsp:
  gaze_deviation_threshold: 0.05
  gaze_time_threshold: 1.5
  gaze_smoothing_window: 8
  fidget_threshold: 0.002
  fidget_window_size: 30
  fidget_smoothing_window: 5

# HUD overlay
hud:
  width: 560
  height: 460
  update_interval_ms: 100
  # Position: "top_right" | "top_left" | "bottom_right" | "bottom_left"
  position: "top_right"
  margin: 16

# Biometric heatmap (OpenCV window via --show-heatmap).
heatmap:
  enabled: false
  window_title: "Lumina Biometric Heatmap"
